<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAT TTT demo</title>
  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #1a1f3a;
      --card: rgba(255,255,255,0.12);
      --card-border: rgba(255,255,255,0.22);
      --text: #eaf0ff;
      --muted: #b9c4e8;
      --accent: #7ee7ff;
      --accent2: #c78bff;
      --cell: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 20% 10%, #243b74 0%, transparent 40%),
                  radial-gradient(circle at 80% 20%, #572d77 0%, transparent 35%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .wrap {
      width: 100%;
      max-width: 760px;
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      padding: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.2px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }

    #modeLabel, #roomCode { color: var(--accent); font-weight: 700; }

    .row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }

    input, button {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.07);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      transition: 0.15s ease;
    }

    input::placeholder { color: #c6d1f0aa; }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.35); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    #localBtn, #createBtn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0d18;
      border: none;
    }

    #status {
      margin-top: 10px;
      min-height: 24px;
      color: #dce6ff;
      font-weight: 500;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, minmax(78px, 1fr));
      gap: 10px;
      margin-top: 16px;
      max-width: 360px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      width: 100%;
      font-size: 34px;
      font-weight: 800;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: var(--cell);
      color: white;
      text-shadow: 0 0 14px rgba(255,255,255,0.35);
    }

    .cell:not(:disabled):hover {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.3), 0 0 18px rgba(126,231,255,0.35);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>MAT TTT demo</h1>
    <div class="meta">Mode: <span id="modeLabel">Online</span> | Room: <span id="roomCode">-</span></div>
    <div class="row">
      <button id="localBtn">Play on one screen</button>
      <button id="createBtn">Create room</button>
      <input id="codeInput" placeholder="Enter room code" maxlength="8" />
      <button id="joinBtn">Join room</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="status">Create or join a room, or choose one-screen mode.</div>
    <div id="board"></div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let mySymbol = null;
    let roomCode = null;
    let localMode = false;
    let state = { board: Array(9).fill(null), turn: 'X', winner: null, status: 'waiting', players: [] };

    const statusEl = document.getElementById('status');
    const roomCodeEl = document.getElementById('roomCode');
    const modeLabelEl = document.getElementById('modeLabel');
    const boardEl = document.getElementById('board');

    function checkWinner(board) {
      const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (const [a,b,c] of lines) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) return board[a];
      }
      if (board.every(Boolean)) return 'draw';
      return null;
    }

    function startLocalMode() {
      localMode = true;
      mySymbol = null;
      roomCode = null;
      state = { board: Array(9).fill(null), turn: 'X', winner: null, status: 'playing', players: [] };
      render();
    }

    function localMove(idx) {
      if (state.winner || state.board[idx]) return;
      state.board[idx] = state.turn;
      const result = checkWinner(state.board);
      if (result) {
        state.winner = result;
        state.status = 'finished';
      } else {
        state.turn = state.turn === 'X' ? 'O' : 'X';
      }
      render();
    }

    function render() {
      boardEl.innerHTML = '';
      state.board.forEach((val, idx) => {
        const btn = document.createElement('button');
        btn.className = 'cell';
        btn.textContent = val || '';

        if (localMode) {
          btn.disabled = !!val || !!state.winner;
          btn.onclick = () => localMove(idx);
        } else {
          btn.disabled = !!val || state.winner || state.status !== 'playing' || state.turn !== mySymbol;
          btn.onclick = () => socket.emit('move', { code: roomCode, index: idx });
        }

        boardEl.appendChild(btn);
      });

      modeLabelEl.textContent = localMode ? 'One-screen local' : 'Online';
      roomCodeEl.textContent = roomCode || '-';

      if (localMode) {
        if (state.winner === 'draw') statusEl.textContent = 'Local game: Draw.';
        else if (state.winner) statusEl.textContent = `Local game: ${state.winner} wins.`;
        else statusEl.textContent = `Local game: ${state.turn}'s turn.`;
        return;
      }

      if (!roomCode) {
        statusEl.textContent = 'Create or join a room, or choose one-screen mode.';
      } else if (state.status === 'waiting') {
        statusEl.textContent = `Waiting for another player... You are ${mySymbol}.`;
      } else if (state.winner === 'draw') {
        statusEl.textContent = 'Draw game.';
      } else if (state.winner) {
        statusEl.textContent = `Winner: ${state.winner}. ${state.winner === mySymbol ? 'You won!' : 'You lost.'}`;
      } else {
        statusEl.textContent = `You are ${mySymbol}. Turn: ${state.turn}.`;
      }
    }

    document.getElementById('localBtn').onclick = startLocalMode;
    document.getElementById('createBtn').onclick = () => {
      localMode = false;
      socket.emit('createRoom');
    };
    document.getElementById('joinBtn').onclick = () => {
      localMode = false;
      const code = document.getElementById('codeInput').value;
      socket.emit('joinRoom', code);
    };
    document.getElementById('resetBtn').onclick = () => {
      if (localMode) {
        state = { board: Array(9).fill(null), turn: 'X', winner: null, status: 'playing', players: [] };
        render();
      } else if (roomCode) {
        socket.emit('reset', roomCode);
      }
    };

    socket.on('roomCreated', ({ code, symbol, game }) => {
      localMode = false;
      roomCode = code;
      mySymbol = symbol;
      state = game;
      render();
    });

    socket.on('roomJoined', ({ code, symbol, game }) => {
      localMode = false;
      roomCode = code;
      mySymbol = symbol;
      state = game;
      render();
    });

    socket.on('joinError', (msg) => { statusEl.textContent = msg; });
    socket.on('state', (game) => {
      if (!localMode) {
        state = game;
        render();
      }
    });

    render();
  </script>
</body>
</html>
