<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phase 2 Enterprise Decision Intelligence at Scale architecture diagram">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif; fill:#0f172a}
      .subtitle{font:400 17px 'Segoe UI',Arial,sans-serif; fill:#475569}
      .lane{fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:24}
      .laneTitle{font:700 20px 'Segoe UI',Arial,sans-serif; fill:#1e293b}
      .box{fill:#ffffff; stroke:#94a3b8; stroke-width:2; rx:18}
      .boxBlue{fill:#eff6ff; stroke:#60a5fa; stroke-width:2; rx:18}
      .boxTeal{fill:#ecfeff; stroke:#14b8a6; stroke-width:2; rx:18}
      .boxPurple{fill:#f5f3ff; stroke:#8b5cf6; stroke-width:2; rx:18}
      .boxGray{fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:18}
      .boxText{font:700 18px 'Segoe UI',Arial,sans-serif; fill:#0f172a}
      .subText{font:400 14px 'Segoe UI',Arial,sans-serif; fill:#475569}
      .small{font:600 13px 'Segoe UI',Arial,sans-serif; fill:#334155}
      .band{fill:#eef2ff; stroke:#818cf8; stroke-width:2; rx:20}
      .callout{fill:#fff7ed; stroke:#fb923c; stroke-width:2; rx:16}
      .callText{font:600 15px 'Segoe UI',Arial,sans-serif; fill:#9a3412}
