  <text x="950" y="382" class="boxText">Azure AI Search</text><text x="934" y="406" class="subText">grounding over notes, docs, policies</text>
  <rect x="905" y="475" width="270" height="100" class="boxTeal"/>
  <text x="945" y="517" class="boxText">Azure OpenAI Service</text><text x="938" y="542" class="subText">copilot reasoning, summaries, recommendations</text>

