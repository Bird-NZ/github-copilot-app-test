project:
  summary: An Azure-hosted NZ individual IR3 tax preparation application for public users that collects tax data and evidence,
    handles crypto transactions, maps income to IR3 references, and produces draft filing outputs with auditability and IRD-grounded
    assistance. The prototype validates the end-to-end architecture and delivery path for technical and stakeholder demonstrations.
  goals:
  - Demonstrate full end-to-end tax preparation workflow from signup to export
  - Validate Azure architecture for public-facing tax application
  - Prove crypto transaction processing and calculation capabilities
  - Demonstrate IRD-grounded assistance for tax guidance
  - Establish deployment and delivery pipeline for stakeholder demos
requirements:
  functional:
  - User registration and authentication for public users
  - Tax year workspace creation and management
  - Conditional questionnaire system for tax data collection
  - Document upload and storage for tax evidence
  - Manual income data entry across multiple categories
  - Crypto transaction entry and capital gains calculation
  - IR3 box code mapping for all income types
  - IRD guidance retrieval and assistance
  - Draft tax return calculation and preview
  - Export summary in appropriate format
  - Full audit trail of user data changes and system calculations
  non_functional:
  - None
constraints:
- NZ-only deployment (single Azure region)
- Public internet access required for end users
- Prototype timeline for technical and stakeholder demo
- Must demonstrate full architecture stack
- 'Policy override: None - User chose to override'
decisions:
- None
open_items:
- Frontend technology stack (separate SPA vs monolithic web app vs static site)
- Backend API framework and language choice
- Data model design (relational vs document store for tax data)
- Document processing requirements (storage-only vs OCR/extraction)
- IRD guidance implementation (RAG with vector DB vs simpler lookup)
- Crypto calculation complexity (real-time vs batch processing)
- Authentication method (custom email/password, social providers, or Azure B2C)
- Export format requirements (PDF, CSV, myIR integration, digital signatures)
- Expected user scale and concurrency for demo
- External integration needs (exchange APIs, bank feeds)
- Multi-factor authentication requirements
- Backup and data retention policies
- Query patterns and reporting needs
- File type support and upload size limits
- Session management and timeout policies
- Error handling and user notification strategy
confirmed_items: []
risks:
- Scope uncertainty may impact architecture decisions (full-stack unknowns)
- Crypto calculation complexity could require specialized services or libraries
- IRD guidance integration approach undefined (impacts AI service choices)
- Document processing requirements unclear (may need additional services)
- Authentication strategy not determined (impacts identity service selection)
- Data model ambiguity may lead to suboptimal database choice
- External integration needs unknown (may require API Management or additional security)
scope:
  in_scope:
  - User registration and authentication system
  - Tax year workspace creation
  - Questionnaire data collection flow
  - Document upload capability
  - Income and crypto transaction entry
  - Draft calculation engine with IR3 mapping
  - IRD guidance assistance feature
  - Export functionality
  - Audit logging of user actions and calculations
  - End-to-end deployment to Azure
  - Technical and stakeholder demo capability
  out_of_scope:
  - Integration with IRD myIR system
  - Production-grade security hardening beyond Azure baseline
  - Multi-region deployment and disaster recovery
  - Automated CI/CD pipeline (manual deployment acceptable for prototype)
  - Comprehensive load testing and performance optimization
  - Advanced analytics and reporting dashboards
  - Automated document OCR and data extraction (unless required)
  deferred:
  - Exchange API integrations for automated crypto import
  - Bank feed integrations for automated income import
  - Advanced fraud detection and validation rules
  - Multi-factor authentication
  - Digital signature support for exports
  - Automated backup and point-in-time recovery
  - Production monitoring and alerting rules
  - Compliance certification (SOC2, ISO27001, etc.)
  - Multi-tenant architecture for tax professional use cases
  - Mobile application development
  - Internationalization beyond NZ
architecture:
  services:
  - Azure Container Apps or App Service (compute hosting for frontend/backend - awaiting technology stack decision)
  - Azure SQL Database or Cosmos DB (data storage - pending data model and query pattern clarity)
  - Azure Blob Storage (document/evidence storage)
  - Azure Key Vault (secrets management and certificate storage)
  - Azure OpenAI or AI Search (IRD guidance assistance - pending RAG vs lookup decision)
  - Azure Monitor and Application Insights (observability and audit logging)
  - Azure Active Directory B2C or App Service Authentication (user authentication - pending auth strategy)
  - Azure API Management (optional - if external integrations or rate limiting required)
  - Azure Virtual Network (network isolation for services)
  - Azure Log Analytics (centralized logging for audit trail)
  integrations: []
  data_flow: ''
