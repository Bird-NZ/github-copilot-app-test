- exchange: 2
  timestamp: '2026-03-21T08:14:03.688432+00:00'
  user: 'Building an NZ individual tax return app (IR3-focused) for public users. Core problem: collect and structure all
    required tax data and documents, guide users through NZ-specific tax questions, handle crypto transactions, and generate
    accountant-ready IR3-style outputs with references. Typical user flow: sign up, create tax year workspace, complete conditional
    questionnaire, upload evidence docs, import crypto CSV + enter income, review AI-assisted categorizations with citations
    from IRD docs, see draft tax calculations, export draft summary and filing pack.'
  assistant: 'Thanks for the detail — that''s a clear picture. Let me make sure I understand the NZ tax context and then dig
    into the technical requirements.


    **A few quick clarifications on the functional side:**


    1. **User base and scale** — Who''s your target audience? Are we talking individual taxpayers doing their own returns,
    or is this a tool for tax agents/accountants preparing IR3s on behalf of clients? And roughly how many users are you expecting
    for the prototype demo vs. eventual production?


    2. **Tax year workspace** — When you say "tax year workspace," I''m picturing each user can have multiple tax years open
    (e.g., preparing 2024 and amending 2023). Is that right, or is it one active return per user?


    3. **Conditional questionnaire** — Tell me more about the logic here. How complex does the branching get? Are we talking
    simple "if rental income > 0, ask rental questions" or more intricate dependency chains? Does the questionnaire need to
    reference previous answers or imported data?


    4. **Crypto transactions** — Walk me through the crypto workflow. User uploads a CSV from an exchange — what happens next?
    Does the AI categorize each transaction (disposal, trade, income event), or does the user confirm categories? How do you
    handle cost basis tracking and FX conversions to NZD?


    5. **AI-assisted categorizations with IRD citations** — This is interesting. Are you envisioning the AI reading IRD guidance
    documents and citing specific sections when it suggests how to treat an income item or deduction? What''s the source material
    — public IRD determinations, operational statements, the actual Income Tax Act?


    6. **Accountant-ready outputs** — What does "accountant-ready" mean in practice? A pre-filled IR3 PDF, a structured JSON/CSV
    export, or something else? Do accountants need to import this into specific software (Xero Practice Manager, CCH, MYOB)?


    Now let''s talk about the **technical architecture**:


    7. **Authentication** — How do users sign in? Are you building email/password registration from scratch, using social
    logins (Google, Microsoft), or integrating with an existing identity provider? Any multi-tenancy concerns (e.g., tax agents
    managing multiple client workspaces)?


    8. **Data residency** — NZ tax data is sensitive. Do you have requirements around where the data physically lives? Azure
    has an NZ region (Auckland) — is that where everything needs to be, or can some services be in Australia Southeast?


    9. **Document storage** — You mentioned uploading evidence docs (receipts, statements, etc.). What formats and sizes are
    typical? Are these just stored as-is, or does the system need to OCR them or extract metadata?


    10. **AI model selection** — For the categorization and IRD citation features, what AI capabilities are you thinking?
    Sounds like you need document retrieval (RAG pattern over IRD guidance) plus reasoning about tax treatment. Are you planning
    to use Azure OpenAI (GPT-4), or have you considered alternatives?


    11. **Integration touchpoints** — Does this system need to talk to any external APIs? For example, exchange rate feeds
    for FX conversion, IRD''s online services for validation, crypto exchange APIs, or accounting software for export?


    12. **Security and compliance** — Tax data is obviously sensitive. Any specific compliance requirements (NZ Privacy Act,
    ISO 27001, etc.)? Do you need audit logging of who accessed or changed what?


    Let me pause there and get your thoughts on these areas before we go further.'
- exchange: 3
  timestamp: '2026-03-21T08:14:35.008753+00:00'
  user: 'Prototype goal: validate technical architecture and end-to-end flow on Azure for a stakeholder demo and technical
    feasibility. Must include secure auth, document storage, knowledge-grounded Q&A, mapping to IR3 fields, and auditable
    change history.'
  assistant: 'Perfect — that gives me a clear scope for what the prototype needs to prove. Let me build on that and clarify
    a few technical boundaries:


    **Prototype scope refinement:**


    1. **Stakeholder demo audience** — Who''s watching this demo? Technical leadership, potential investors, tax domain experts,
    or a mix? That helps me understand whether the demo needs polished UI or if API-level demonstrations are sufficient.


    2. **Real vs. mocked data** — For the prototype, should we use real IRD guidance documents and actual IR3 field mappings,
    or can we work with a representative subset? Similarly, can crypto transactions be synthetic test data, or do you need
    to handle real exchange CSV formats?


    3. **User count for demo** — Are we talking a handful of test accounts for the demo, or do you need to show it can handle
    concurrent users? This affects compute SKU choices.


    Now, back to those technical questions I asked earlier. Let me be more specific about what the architect will need:


    **Authentication & user model:**


    4. **Sign-up flow** — You mentioned "sign up" — should I assume you''re building email/password registration from scratch,
    or would you prefer social login (Google/Microsoft) to simplify the prototype? And is this single-user-per-account, or
    do you need the concept of a tax agent managing multiple client workspaces?


    5. **Access control** — Within a tax year workspace, is it just the owner who can edit, or do you envision sharing with
    an accountant for review? If shared access is in scope for the prototype, how should permissions work?


    **Data architecture:**


    6. **Data model** — Let me understand the core entities. I''m picturing: User → TaxYear → Workspace → (Questionnaire Answers,
    Documents, Transactions, Calculations). Is that the right hierarchy? And when you say "auditable change history," do you
    need full event sourcing (every change recorded with timestamp and user), or is simpler audit logging sufficient?


    7. **Questionnaire structure** — Tell me about the conditional branching complexity. If the logic is "if rental income
    exists, show rental section," that''s straightforward. But if it''s "question 47 options depend on answers to 12, 15,
    and 33," that might need a rules engine. How deep does the branching go?


    8. **Document types and volumes** — When users upload evidence docs, what are we talking about? PDFs of bank statements,
    phone photos of receipts, CSV files from exchanges? And typical sizes — are we talking a few MB per document, or larger?
    This affects storage and retrieval strategy.


    **AI capabilities:**


    9. **Knowledge base for IRD guidance** — You mentioned AI citing IRD docs. What''s the source corpus? Are we indexing
    public IRD fact sheets and determinations, or do you have proprietary tax content? And how large is this corpus — dozens
    of documents or thousands of pages?


    10. **AI workflow** — Walk me through what happens when the AI categorizes a crypto transaction. Does it look at the transaction
    type in the CSV, cross-reference IRD guidance on crypto taxation, and suggest a category with a citation? And does the
    user just approve/reject, or can they override with their own reasoning?


    11. **IR3 field mapping** — When you say "generate accountant-ready IR3-style outputs," I assume that means mapping collected
    data to specific IR3 form fields. Is this mapping rule-based (deterministic logic), AI-assisted, or a hybrid? And is the
    output a pre-filled PDF, a structured data file, or both?


    **Integration & external dependencies:**


    12. **FX rates for crypto** — You mentioned FX conversions to NZD. Does the system need to fetch live exchange rates from
    an API, or can we use a static table of historical rates for the prototype?


    13. **Crypto exchange formats** — Do you have sample CSV formats from the exchanges you need to support? Each exchange
    formats their transaction history differently — knowing which ones to prioritize helps scope the import logic.


    14. **Accountant software integration** — Is exporting to a specific accounting package in scope for the prototype, or
    is a generic JSON/CSV export sufficient to demonstrate the concept?


    **Infrastructure & environments:**


    15. **Data residency** — Does NZ tax data legally need to stay in the Auckland region, or is Australia Southeast acceptable
    for the prototype? This affects which Azure services we can use and their availability.


    16. **Deployment timeline** — What''s the timeline for this prototype demo? That affects whether we optimize for speed
    (simpler architecture, fewer services) or completeness (closer to production-ready).


    17. **Budget constraints** — Any cost guardrails I should keep in mind? Azure AI services and vector search can add up
    quickly if we''re not careful about SKU selection.


    I know that''s a lot of questions, but the answers will let me design an architecture that actually fits your needs rather
    than guessing. Which areas should we tackle first?'
