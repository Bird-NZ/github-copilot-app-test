  assistant: 'I''d be happy to help you design an Azure prototype for your NZ IR3 tax application. Let me understand what
    you''re building here.


    So this is a tax return application for New Zealand individual taxpayers filing IR3 forms. You''ve mentioned several capabilities
    — authentication, a questionnaire flow, document uploads, cryptocurrency CSV parsing, IR3 calculation logic, export functionality,
    and an audit trail.


    Let me start by understanding the core user journey and what this prototype needs to prove:


    **User workflow and audience:**

    - Walk me through the typical user journey from start to finish. Someone arrives at your app — what''s the first thing
    they do, and what are the key steps until they have a completed IR3 form?

    - Who is the primary user? Individual taxpayers filing their own returns, or tax agents/accountants handling multiple
    clients?

    - For the prototype demo, who''s your audience — potential investors, IRD stakeholders, or internal product validation?


    **Authentication approach:**

    - How do you expect users to sign in? Are you thinking email/password registration, social login (Google/Microsoft), or
    integration with an existing identity provider?

    - Do you need role separation (e.g., taxpayer vs. tax agent), or is everyone accessing the same feature set for the prototype?


    **Questionnaire functionality:**

    - Tell me about the questionnaire. What kind of information are you collecting from users before they start entering tax
    data?

    - Is this a static list of questions, or does it branch based on user answers (e.g., "Do you have investment income?"
    → show crypto questions)?

    - Does the questionnaire state need to be saved and resumed later?


    **Data scope and volume:**

    - What types of documents will users upload? Pay slips, bank statements, crypto exchange reports, donation receipts?

    - For cryptocurrency CSV parsing — what exchanges are you targeting, and roughly how many transactions per user are we
    talking about? Tens, hundreds, thousands?

    - Tell me about the data entities in the system. Beyond users and tax returns, what else needs to be tracked (questionnaire
    responses, uploaded files, parsed crypto transactions, audit events)?


    **IR3 mapping and calculation:**

    - You mentioned IR3 mapping and a "calculation skeleton" — what''s in scope for the prototype here? Are you aiming to
    calculate a subset of IR3 fields (like salary + crypto income), or just demonstrate the data flow without full tax logic?

    - Will the prototype validate calculations against IRD rules, or is this more about proving the workflow and data structure?


    **Export and audit trail:**

    - What format does the IR3 export need to be in? PDF for user review, or a structured format for IRD submission (like
    myIR Gateway)?

    - For the audit trail — what events need to be captured? User logins, data changes, document uploads, calculation runs?
    Who consumes the audit trail (system admins, compliance team)?


    **Prototype scope boundary:**

    - This sounds like it could grow quite large. For the prototype demo, what''s the one workflow you absolutely must show
    working end-to-end?

    - Are there features in your list that are important long-term but could be mocked or simplified for the initial demo
    (e.g., full crypto tax calculations vs. just parsing and displaying the data)?


    **Scale and timeline:**

    - Roughly how many users do you expect during the prototype phase — a handful of testers, or opening it up to a broader
    group?

    - What''s your timeline for the prototype? Are we talking weeks or months?


    Let me pause there and hear your thoughts on these areas before diving into technical integration and security requirements.'
