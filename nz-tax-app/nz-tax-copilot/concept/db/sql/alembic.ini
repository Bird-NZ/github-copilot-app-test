# Alembic configuration for NZ Tax Copilot SQL migrations
# This file is used if deploying via Alembic instead of raw SQL

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# SQL Server connection string template
# Use environment variable for actual connection
sqlalchemy.url = mssql+pyodbc:///?odbc_connect=${SQLALCHEMY_DATABASE_URI}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S