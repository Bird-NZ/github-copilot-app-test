<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phase 1 Enterprise Insight Foundation architecture diagram">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif; fill:#0f172a}
      .subtitle{font:400 17px 'Segoe UI',Arial,sans-serif; fill:#475569}
      .lane{fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:24}
      .laneTitle{font:700 20px 'Segoe UI',Arial,sans-serif; fill:#1e293b}
      .box{fill:#ffffff; stroke:#94a3b8; stroke-width:2; rx:18}
      .boxBlue{fill:#eff6ff; stroke:#60a5fa; stroke-width:2; rx:18}
      .boxTeal{fill:#ecfeff; stroke:#2dd4bf; stroke-width:2; rx:18}
      .boxPurple{fill:#f5f3ff; stroke:#a78bfa; stroke-width:2; rx:18}
      .boxGray{fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:18}
      .boxText{font:700 18px 'Segoe UI',Arial,sans-serif; fill:#0f172a}
      .subText{font:400 14px 'Segoe UI',Arial,sans-serif; fill:#475569}
      .small{font:600 13px 'Segoe UI',Arial,sans-serif; fill:#334155}
      .band{fill:#eef2ff; stroke:#818cf8; stroke-width:2; rx:20}
      .callout{fill:#fff7ed; stroke:#fb923c; stroke-width:2; rx:16}
      .callText{font:600 15px 'Segoe UI',Arial,sans-serif; fill:#9a3412}
      .arrow{stroke:#64748b; stroke-width:3; fill:none; marker-end:url(#arrow)}
      .arrowThin{stroke:#94a3b8; stroke-width:2.2; fill:none; marker-end:url(#arrowThin)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <marker id="arrowThin" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="58" class="title">Phase 1 — Enterprise Insight Foundation</text>
  <text x="60" y="88" class="subtitle">Unify commercial data to deliver trusted reporting, faster decisions, and AI-assisted insight</text>

  <rect x="40" y="120" width="240" height="620" class="lane"/>
  <text x="60" y="155" class="laneTitle">Source Systems</text>
  <rect x="60" y="185" width="200" height="78" class="boxGray"/>
  <text x="80" y="217" class="boxText">CRM / Customer</text><text x="80" y="240" class="subText">accounts, contacts, pipeline</text>
  <rect x="60" y="278" width="200" height="78" class="boxGray"/>
  <text x="80" y="310" class="boxText">ERP / Finance</text><text x="80" y="333" class="subText">orders, revenue, cost data</text>
  <rect x="60" y="371" width="200" height="78" class="boxGray"/>
  <text x="80" y="403" class="boxText">Pricing Systems</text><text x="80" y="426" class="subText">price lists, exceptions, rules</text>
  <rect x="60" y="464" width="200" height="78" class="boxGray"/>
  <text x="80" y="496" class="boxText">Sales Performance</text><text x="80" y="519" class="subText">quotas, win/loss, activity</text>
  <rect x="60" y="557" width="200" height="78" class="boxGray"/>
  <text x="80" y="589" class="boxText">Product / Margin</text><text x="80" y="612" class="subText">portfolio, margin, mix data</text>

  <rect x="320" y="120" width="250" height="620" class="lane"/>
  <text x="340" y="155" class="laneTitle">Ingestion &amp; Integration</text>
  <rect x="345" y="250" width="200" height="92" class="boxBlue"/>
  <text x="365" y="287" class="boxText">Microsoft Fabric</text><text x="365" y="311" class="subText">Data Factory / Pipelines</text>
  <rect x="345" y="380" width="200" height="92" class="boxBlue"/>
  <text x="365" y="417" class="boxText">Azure Data Factory</text><text x="365" y="441" class="subText">integration and orchestration</text>

  <rect x="610" y="120" width="350" height="620" class="lane"/>
  <text x="630" y="155" class="laneTitle">Enterprise Data Platform</text>
  <rect x="640" y="250" width="290" height="100" class="boxBlue"/>
  <text x="665" y="291" class="boxText">Azure Data Lake Storage Gen2</text><text x="665" y="316" class="subText">raw, curated, analytics zones</text>
  <rect x="640" y="395" width="290" height="110" class="boxBlue"/>
  <text x="665" y="438" class="boxText">Microsoft Fabric Lakehouse / Warehouse</text><text x="665" y="463" class="subText">governed analytics and reporting data</text>
  <rect x="675" y="545" width="220" height="70" class="box"/>
  <text x="698" y="587" class="small">semantic model / governed metrics</text>

  <rect x="1000" y="120" width="280" height="620" class="lane"/>
  <text x="1020" y="155" class="laneTitle">AI &amp; Insight Services</text>
  <rect x="1030" y="250" width="220" height="100" class="boxTeal"/>
  <text x="1055" y="292" class="boxText">Azure OpenAI Service</text><text x="1055" y="317" class="subText">summaries, Q&amp;A, insight</text>
  <rect x="1030" y="395" width="220" height="100" class="boxPurple"/>
  <text x="1080" y="437" class="boxText">Power BI</text><text x="1060" y="462" class="subText">dashboards, scorecards, KPIs</text>
  <rect x="1030" y="540" width="220" height="90" class="boxPurple"/>
  <text x="1060" y="578" class="boxText">Insight Portal</text><text x="1054" y="602" class="subText">Azure App Service / Container Apps</text>

  <rect x="1320" y="120" width="240" height="620" class="lane"/>
  <text x="1340" y="155" class="laneTitle">Business Users</text>
  <rect x="1345" y="250" width="190" height="78" class="boxPurple"/>
  <text x="1383" y="294" class="boxText">Commercial Leaders</text>
  <rect x="1345" y="360" width="190" height="78" class="boxPurple"/>
  <text x="1400" y="404" class="boxText">Pricing Teams</text>
  <rect x="1345" y="470" width="190" height="78" class="boxPurple"/>
  <text x="1372" y="514" class="boxText">Sales / Account Teams</text>

  <path d="M260 224 C300 224, 310 296, 345 296" class="arrowThin"/>
  <path d="M260 317 C300 317, 310 296, 345 296" class="arrowThin"/>
  <path d="M260 410 C300 410, 310 426, 345 426" class="arrowThin"/>
  <path d="M260 503 C300 503, 310 426, 345 426" class="arrowThin"/>
  <path d="M260 596 C300 596, 310 426, 345 426" class="arrowThin"/>

  <path d="M545 296 L640 296" class="arrow"/>
  <path d="M545 426 C590 426, 600 426, 640 426" class="arrow"/>
  <path d="M785 350 L785 395" class="arrow"/>
  <path d="M785 505 L785 545" class="arrowThin"/>
  <path d="M930 450 L1030 450" class="arrow"/>
  <path d="M930 430 C980 430, 980 300, 1030 300" class="arrow"/>
  <path d="M1250 445 L1345 445" class="arrow"/>
  <path d="M1140 350 L1140 540" class="arrowThin"/>
  <path d="M1250 585 L1345 510" class="arrow"/>
  <path d="M1250 445 L1345 290" class="arrowThin"/>

  <rect x="40" y="770" width="1520" height="90" class="band"/>
  <text x="65" y="804" class="laneTitle">Security, Governance &amp; Operations</text>
  <rect x="430" y="790" width="170" height="44" class="box"/><text x="468" y="818" class="small">Microsoft Entra ID</text>
  <rect x="620" y="790" width="150" height="44" class="box"/><text x="660" y="818" class="small">Azure Key Vault</text>
  <rect x="790" y="790" width="210" height="44" class="box"/><text x="823" y="818" class="small">Azure Monitor / Logs</text>
  <rect x="1020" y="790" width="170" height="44" class="box"/><text x="1062" y="818" class="small">Microsoft Purview</text>

  <rect x="1290" y="250" width="250" height="66" class="callout"/>
  <text x="1310" y="289" class="callText">Trusted commercial data foundation</text>
  <rect x="1290" y="335" width="250" height="66" class="callout"/>
  <text x="1326" y="374" class="callText">AI-assisted insight and summarization</text>
  <rect x="1290" y="420" width="250" height="66" class="callout"/>
  <text x="1330" y="459" class="callText">Faster and more consistent decisions</text>
</svg>