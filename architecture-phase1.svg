<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phase 1 Enterprise Insight Foundation architecture diagram">
  <defs>
    <style>
      .title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
      .laneTitle{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#1e293b}
      .boxGray{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
      .boxBlue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2;rx:18}
      .boxTeal{fill:#ecfeff;stroke:#14b8a6;stroke-width:2;rx:18}
      .boxPurple{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:18}
      .boxNeutral{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:18}
      .band{fill:#eef2ff;stroke:#818cf8;stroke-width:2;rx:22}
      .h1{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .h2{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .chip{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow2{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow2)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="70" y="72" class="title">Phase 1 — Enterprise Insight Foundation</text>
  <text x="70" y="106" class="subtitle">Unify commercial data to deliver trusted reporting, faster decisions, and AI-assisted insight</text>

  <rect x="40" y="150" width="280" height="720" class="lane"/>
  <text x="62" y="192" class="laneTitle">Source Systems</text>
  <rect x="62" y="235" width="236" height="82" class="boxGray"/>
  <text x="86" y="273" class="h1">CRM / Customer</text><text x="86" y="299" class="h2">accounts, contacts, pipeline</text>
  <rect x="62" y="337" width="236" height="82" class="boxGray"/>
  <text x="86" y="375" class="h1">ERP / Finance</text><text x="86" y="401" class="h2">orders, revenue, cost data</text>
  <rect x="62" y="439" width="236" height="82" class="boxGray"/>
  <text x="86" y="477" class="h1">Pricing Systems</text><text x="86" y="503" class="h2">price lists, exceptions, rules</text>
  <rect x="62" y="541" width="236" height="82" class="boxGray"/>
  <text x="86" y="579" class="h1">Sales Performance</text><text x="86" y="605" class="h2">quotas, win/loss, activity</text>
  <rect x="62" y="643" width="236" height="82" class="boxGray"/>
  <text x="86" y="681" class="h1">Product / Margin</text><text x="86" y="707" class="h2">portfolio, margin, mix data</text>

  <rect x="350" y="150" width="310" height="720" class="lane"/>
  <text x="372" y="192" class="laneTitle">Ingestion &amp; Integration</text>
  <rect x="388" y="315" width="234" height="92" class="boxBlue"/>
  <text x="422" y="356" class="h1">Microsoft Fabric</text><text x="422" y="382" class="h2">Data Factory / Pipelines</text>
  <rect x="388" y="460" width="234" height="92" class="boxBlue"/>
  <text x="423" y="501" class="h1">Azure Data Factory</text><text x="423" y="527" class="h2">integration and orchestration</text>

  <rect x="690" y="150" width="430" height="720" class="lane"/>
  <text x="712" y="192" class="laneTitle">Enterprise Data Platform</text>
  <rect x="740" y="300" width="330" height="105" class="boxBlue"/>
  <text x="776" y="344" class="h1">Azure Data Lake Storage Gen2</text><text x="776" y="371" class="h2">raw, curated, analytics zones</text>
  <rect x="740" y="470" width="330" height="115" class="boxBlue"/>
  <text x="774" y="517" class="h1">Microsoft Fabric Lakehouse / Warehouse</text><text x="795" y="544" class="h2">governed analytics and reporting data</text>
  <rect x="805" y="640" width="200" height="68" class="boxNeutral"/>
  <text x="830" y="682" class="chip">semantic model / governed metrics</text>

  <rect x="1150" y="150" width="320" height="720" class="lane"/>
  <text x="1172" y="192" class="laneTitle">AI &amp; Insight Services</text>
  <rect x="1190" y="295" width="240" height="98" class="boxTeal"/>
  <text x="1222" y="338" class="h1">Azure OpenAI Service</text><text x="1243" y="364" class="h2">summaries, Q&amp;A, insight</text>
  <rect x="1190" y="450" width="240" height="98" class="boxPurple"/>
  <text x="1283" y="493" class="h1">Power BI</text><text x="1228" y="519" class="h2">dashboards, scorecards, KPIs</text>
  <rect x="1190" y="605" width="240" height="98" class="boxPurple"/>
  <text x="1252" y="648" class="h1">Insight Portal</text><text x="1218" y="674" class="h2">Azure App Service / Container Apps</text>

  <rect x="1500" y="150" width="380" height="720" class="lane"/>
  <text x="1522" y="192" class="laneTitle">Business Users &amp; Outcomes</text>
  <rect x="1542" y="300" width="296" height="82" class="boxPurple"/>
  <text x="1612" y="347" class="h1">Commercial Leaders</text>
  <rect x="1542" y="415" width="296" height="82" class="boxPurple"/>
  <text x="1640" y="462" class="h1">Pricing Teams</text>
  <rect x="1542" y="530" width="296" height="82" class="boxPurple"/>
  <text x="1594" y="577" class="h1">Sales / Account Teams</text>
  <rect x="1542" y="655" width="296" height="140" class="boxNeutral"/>
  <text x="1594" y="697" class="h1">Business Outcomes</text>
  <text x="1570" y="730" class="h2">• Trusted commercial data foundation</text>
  <text x="1570" y="757" class="h2">• AI-assisted insight and summarization</text>
  <text x="1570" y="784" class="h2">• Faster, more consistent decisions</text>

  <path d="M298 276 C340 276, 350 350, 388 350" class="arrow2"/>
  <path d="M298 378 C340 378, 350 350, 388 350" class="arrow2"/>
  <path d="M298 480 C340 480, 350 506, 388 506" class="arrow2"/>
  <path d="M298 582 C340 582, 350 506, 388 506" class="arrow2"/>
  <path d="M298 684 C340 684, 350 506, 388 506" class="arrow2"/>
  <path d="M622 361 L740 352" class="arrow"/>
  <path d="M622 506 L740 528" class="arrow"/>
  <path d="M905 405 L905 470" class="arrow"/>
  <path d="M905 585 L905 640" class="arrow2"/>
  <path d="M1070 528 L1190 499" class="arrow"/>
  <path d="M1070 528 C1130 528, 1130 344, 1190 344" class="arrow"/>
  <path d="M1310 393 L1310 605" class="arrow2"/>
  <path d="M1430 499 L1542 456" class="arrow"/>
  <path d="M1430 650 L1542 571" class="arrow"/>
  <path d="M1430 344 L1542 341" class="arrow2"/>

  <rect x="40" y="905" width="1840" height="110" class="band"/>
  <text x="65" y="948" class="laneTitle">Security, Governance &amp; Operations</text>
  <rect x="520" y="930" width="190" height="48" class="boxNeutral"/><text x="561" y="960" class="chip">Microsoft Entra ID</text>
  <rect x="735" y="930" width="170" height="48" class="boxNeutral"/><text x="781" y="960" class="chip">Azure Key Vault</text>
  <rect x="930" y="930" width="220" height="48" class="boxNeutral"/><text x="970" y="960" class="chip">Azure Monitor / Logs</text>
  <rect x="1175" y="930" width="190" height="48" class="boxNeutral"/><text x="1218" y="960" class="chip">Microsoft Purview</text>
</svg>