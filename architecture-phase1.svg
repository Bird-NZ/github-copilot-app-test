<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phase 1 Enterprise Insight Foundation architecture diagram">
  <defs>
    <linearGradient id="bgBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <style>
      .title{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .lane{fill:#f8fafc;stroke:#d6dee8;stroke-width:2;rx:24}
      .laneTitle{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#1f2937}
      .panelBlue{fill:#eef6ff;stroke:#5aa2f8;stroke-width:2.2;rx:20}
      .panelTeal{fill:#ecfeff;stroke:#22c7b8;stroke-width:2.2;rx:20}
      .panelPurple{fill:#f6f2ff;stroke:#9b7cf7;stroke-width:2.2;rx:20}
      .panelNeutral{fill:#ffffff;stroke:#cdd7e3;stroke-width:2;rx:18}
      .source{fill:#ffffff;stroke:#a8b4c3;stroke-width:2;rx:18}
      .outcome{fill:#fbfdff;stroke:#d8e0ea;stroke-width:2;rx:18}
      .band{fill:url(#bgBand);stroke:#7c9cff;stroke-width:2;rx:22}
      .h1{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .h2{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#556274}
      .chip{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .arrow{stroke:#66758a;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrowSoft{stroke:#97a5b6;stroke-width:3;fill:none;marker-end:url(#arrowSoft)}
      .legend{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#64748b}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#66758a"/></marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#97a5b6"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="70" y="72" class="title">Phase 1 — Enterprise Insight Foundation</text>
  <text x="70" y="106" class="subtitle">Unify commercial data to deliver trusted reporting, faster decisions, and AI-assisted insight</text>

  <rect x="40" y="150" width="280" height="720" class="lane"/>
  <text x="62" y="192" class="laneTitle">Source Systems</text>
  <rect x="62" y="235" width="236" height="82" class="source"/>
  <text x="86" y="273" class="h1">CRM / Customer</text><text x="86" y="299" class="h2">accounts, contacts, pipeline</text>
  <rect x="62" y="337" width="236" height="82" class="source"/>
  <text x="86" y="375" class="h1">ERP / Finance</text><text x="86" y="401" class="h2">orders, revenue, cost data</text>
  <rect x="62" y="439" width="236" height="82" class="source"/>
  <text x="86" y="477" class="h1">Pricing Systems</text><text x="86" y="503" class="h2">price lists, exceptions, rules</text>
  <rect x="62" y="541" width="236" height="82" class="source"/>
  <text x="86" y="579" class="h1">Sales Performance</text><text x="86" y="605" class="h2">quotas, win/loss, activity</text>
  <rect x="62" y="643" width="236" height="82" class="source"/>
  <text x="86" y="681" class="h1">Product / Margin</text><text x="86" y="707" class="h2">portfolio, margin, mix data</text>

  <rect x="350" y="150" width="290" height="720" class="lane"/>
  <text x="372" y="192" class="laneTitle">Ingestion &amp; Integration</text>
  <rect x="388" y="315" width="214" height="96" class="panelBlue"/>
  <text x="427" y="357" class="h1">Microsoft Fabric</text><text x="425" y="384" class="h2">Data Factory / Pipelines</text>
  <rect x="388" y="470" width="214" height="96" class="panelBlue"/>
  <text x="425" y="512" class="h1">Azure Data Factory</text><text x="412" y="539" class="h2">integration and orchestration</text>

  <rect x="670" y="150" width="460" height="720" class="lane"/>
  <text x="692" y="192" class="laneTitle">Enterprise Data Platform</text>
  <rect x="730" y="295" width="340" height="108" class="panelBlue"/>
  <text x="769" y="340" class="h1">Azure Data Lake Storage Gen2</text><text x="782" y="368" class="h2">raw, curated, analytics zones</text>
  <rect x="730" y="470" width="340" height="118" class="panelBlue"/>
  <text x="766" y="518" class="h1">Microsoft Fabric Lakehouse / Warehouse</text><text x="786" y="546" class="h2">governed analytics and reporting data</text>
  <rect x="815" y="645" width="170" height="64" class="panelNeutral"/>
  <text x="836" y="684" class="chip">semantic model</text>

  <rect x="1160" y="150" width="310" height="720" class="lane"/>
  <text x="1182" y="192" class="laneTitle">AI &amp; Insight Services</text>
  <rect x="1202" y="295" width="226" height="96" class="panelTeal"/>
  <text x="1235" y="337" class="h1">Azure OpenAI Service</text><text x="1243" y="364" class="h2">summaries, Q&amp;A, insight</text>
  <rect x="1202" y="450" width="226" height="96" class="panelPurple"/>
  <text x="1292" y="492" class="h1">Power BI</text><text x="1236" y="519" class="h2">dashboards, scorecards, KPIs</text>
  <rect x="1202" y="605" width="226" height="96" class="panelPurple"/>
  <text x="1260" y="647" class="h1">Insight Portal</text><text x="1231" y="674" class="h2">App Service / Container Apps</text>

  <rect x="1500" y="150" width="380" height="720" class="lane"/>
  <text x="1522" y="192" class="laneTitle">Business Users &amp; Outcomes</text>
  <rect x="1542" y="285" width="296" height="78" class="panelPurple"/>
  <text x="1612" y="331" class="h1">Commercial Leaders</text>
  <rect x="1542" y="395" width="296" height="78" class="panelPurple"/>
  <text x="1640" y="441" class="h1">Pricing Teams</text>
  <rect x="1542" y="505" width="296" height="78" class="panelPurple"/>
  <text x="1594" y="551" class="h1">Sales / Account Teams</text>
  <rect x="1542" y="630" width="296" height="150" class="outcome"/>
  <text x="1600" y="671" class="h1">Business Outcomes</text>
  <text x="1572" y="709" class="h2">• Trusted commercial data foundation</text>
  <text x="1572" y="738" class="h2">• AI-assisted insight and summarization</text>
  <text x="1572" y="767" class="h2">• Faster, more consistent decisions</text>

  <path d="M298 276 C340 276, 350 363, 388 363" class="arrowSoft"/>
  <path d="M298 378 C340 378, 350 363, 388 363" class="arrowSoft"/>
  <path d="M298 480 C340 480, 350 518, 388 518" class="arrowSoft"/>
  <path d="M298 582 C340 582, 350 518, 388 518" class="arrowSoft"/>
  <path d="M298 684 C340 684, 350 518, 388 518" class="arrowSoft"/>
  <path d="M602 363 L730 349" class="arrow"/>
  <path d="M602 518 L730 529" class="arrow"/>
  <path d="M900 403 L900 470" class="arrow"/>
  <path d="M900 588 L900 645" class="arrowSoft"/>
  <path d="M1070 529 L1202 498" class="arrow"/>
  <path d="M1070 529 C1140 529, 1140 343, 1202 343" class="arrow"/>
  <path d="M1315 391 L1315 605" class="arrowSoft"/>
  <path d="M1428 343 L1542 324" class="arrow"/>
  <path d="M1428 498 L1542 434" class="arrow"/>
  <path d="M1428 653 L1542 544" class="arrow"/>

  <rect x="40" y="905" width="1840" height="110" class="band"/>
  <text x="65" y="948" class="laneTitle">Security, Governance &amp; Operations</text>
  <rect x="520" y="930" width="190" height="48" class="panelNeutral"/><text x="561" y="960" class="chip">Microsoft Entra ID</text>
  <rect x="735" y="930" width="170" height="48" class="panelNeutral"/><text x="781" y="960" class="chip">Azure Key Vault</text>
  <rect x="930" y="930" width="220" height="48" class="panelNeutral"/><text x="970" y="960" class="chip">Azure Monitor / Logs</text>
  <rect x="1175" y="930" width="190" height="48" class="panelNeutral"/><text x="1218" y="960" class="chip">Microsoft Purview</text>

  <text x="1555" y="955" class="legend">Decision support at scale</text>
</svg>