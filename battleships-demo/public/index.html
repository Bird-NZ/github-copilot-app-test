<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Battleships Demo</title>
  <style>
    :root { --felt:#0f5b45; --felt2:#0a3f31; --wood:#5f3f28; --line:#f3f6ff66; --text:#f4fbff; --muted:#d6e1ea; --hit:#ff2d2d; --miss:#f5f8ff; --cell: clamp(24px, 7.2vw, 34px); --gap: clamp(2px, 0.8vw, 4px); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,Arial,sans-serif; color:var(--text); min-height:100vh; padding:16px; background:linear-gradient(#00000055,#00000075), radial-gradient(circle at 20% 15%, #e6be7b22 0%, transparent 40%), #3b271b; }
    .app { max-width:1120px; margin:0 auto; background:linear-gradient(180deg,#4a3122,#2e1f15); border:1px solid #d7b88a44; border-radius:16px; padding:16px; box-shadow:0 24px 50px #000a, inset 0 0 0 1px #ffffff10; }
    h2 { margin:4px 0; letter-spacing:1.4px; font-size:44px; line-height:1; text-transform:uppercase; color:#e8d9b6; text-shadow:0 2px 0 #0006; text-align:center; } .subtitle { margin:0 0 12px; color:#e6d8bc; font-size:13px; text-align:center; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    button,input { padding:10px 12px; border-radius:10px; border:1px solid #ead5ad66; background:#173b31E6; color:var(--text); font-weight:600; }
    input { min-width:130px; } button:hover { filter:brightness(1.08); }
    .primary { background:linear-gradient(135deg,#1b6f57,#289376); }
    .accent { background:linear-gradient(135deg,#7b4f09,#c08a1a); border-color:#f0c97b99; color:#fff5d8; }
    .statusBar { background:#08271fD9; border:1px solid #e7d3af55; border-radius:10px; padding:10px; margin-bottom:12px; }
    #meta { color:var(--muted); font-size:13px; } #status { font-size:14px; margin-top:4px; font-weight:700; color:#ffe5a6; }
    .boards { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media(max-width:900px){ .boards{grid-template-columns:1fr;} .app{padding:12px;} body{padding:10px;} .row button,.row input{flex:1 1 calc(50% - 8px);} }
    .panel { background:linear-gradient(#00000044,#00000044), url('/assets/style-target.jpg') center/cover no-repeat; border:2px solid #b99a6a; border-radius:20px; padding:12px; box-shadow: inset 0 0 0 1px #fff3, inset 0 -12px 24px #0006, 0 10px 18px #0009; }
    .panel h4 { margin:0 0 8px; font-size:15px; }
    .fleetInfo { margin-top:8px; display:grid; gap:4px; font-size:12px; color:#d8e6f2; }
    .fleetRow { display:flex; justify-content:space-between; align-items:center; background:#07201999; border:1px solid #d7b88a33; border-radius:6px; padding:4px 6px; }
    .fleetBar { height:6px; border-radius:3px; background:linear-gradient(90deg,#bccdde,#6f87a0); }
    .boardShell { display:grid; grid-template-columns:18px auto; gap:6px; align-items:start; }
    .sideLabels { display:grid; grid-template-rows:repeat(10,var(--cell)); gap:var(--gap); font-size:12px; color:#f1e2bf; align-items:center; text-align:center; font-weight:700; }
    .mainBoard { display:block; }
    .gridWrap { position:relative; display:inline-block; }
    .shipsOverlay { position:absolute; inset:0; pointer-events:none; z-index:3; }
    .shipToken { position:absolute; border-radius:999px; background-position:center; background-repeat:no-repeat; background-size:100% 100%; filter: drop-shadow(0 4px 5px #000a); }
    .shipToken::before, .shipToken::after { content:none; }
    .shipToken.h.s1 { background-image:url('/assets/ships/topdown-lock/ship-1-h.png'); }
    .shipToken.h.s2 { background-image:url('/assets/ships/topdown-lock/ship-2-h.png'); }
    .shipToken.h.s3 { background-image:url('/assets/ships/topdown-lock/ship-3-h.png'); }
    .shipToken.h.s4 { background-image:url('/assets/ships/topdown-lock/ship-4-h.png'); }
    .shipToken.h.s5 { background-image:url('/assets/ships/topdown-lock/ship-5-h.png'); }
    .shipToken.v.s1 { background-image:url('/assets/ships/topdown-lock/ship-1-v.png'); }
    .shipToken.v.s2 { background-image:url('/assets/ships/topdown-lock/ship-2-v.png'); }
    .shipToken.v.s3 { background-image:url('/assets/ships/topdown-lock/ship-3-v.png'); }
    .shipToken.v.s4 { background-image:url('/assets/ships/topdown-lock/ship-4-v.png'); }
    .shipToken.v.s5 { background-image:url('/assets/ships/topdown-lock/ship-5-v.png'); }
    .pegHole { position:absolute; width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #1b2127 0 35%, #070b0e 55% 100%); box-shadow: inset 0 0 0 1px #ffffff22, 0 0 0 1px #0008; z-index:5; transform:translate(-50%,-50%); }
    .pegHole.hit { width:10px; height:10px; background:radial-gradient(circle at 35% 30%, #ff8b8b 0 22%, #e33131 28% 60%, #8b1010 75% 100%); box-shadow:0 0 0 1px #ffd0d077, 0 1px 3px #0007; }
    .topLabels { display:grid; grid-template-columns:repeat(10,var(--cell)); gap:var(--gap); margin-bottom:4px; font-size:12px; color:#f1e2bf; text-align:center; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(10,var(--cell)); grid-auto-rows:var(--cell); gap:var(--gap); min-width:max-content; padding:8px; border-radius:2px; background:linear-gradient(180deg,#196a54,#0e4738), repeating-linear-gradient(0deg, #f2e4c477 0 1px, #00000000 1px 10px), repeating-linear-gradient(90deg, #f2e4c477 0 1px, #00000000 1px 10px); box-shadow: inset 0 0 0 2px #efdfbe88, inset 0 12px 16px #ffffff10, inset 0 -12px 18px #0000004d; }
    .cell { width:var(--cell); height:var(--cell); border:1px solid #efdfbe6e; border-radius:0; background:linear-gradient(180deg,#2a7f67,#1a5f4a); cursor:pointer; position:relative; overflow:visible; box-shadow:none; }
    .cell.ship::before { content:""; position:absolute; background:linear-gradient(180deg,#9ea4a7,#535c63); box-shadow:inset 0 0 0 1px #d8dde088, 0 2px 4px #0008; z-index:1; }
    .cell.ship.ship-h::before { top:5px; bottom:5px; left:-3px; right:-3px; border-radius:0; }
    .cell.ship.ship-v::before { left:5px; right:5px; top:-3px; bottom:-3px; border-radius:0; }
    .cell.ship.ship-h.ship-head::before { left:4px; border-top-left-radius:11px; border-bottom-left-radius:11px; }
    .cell.ship.ship-h.ship-tail::before { right:4px; border-top-right-radius:5px; border-bottom-right-radius:5px; }
    .cell.ship.ship-v.ship-head::before { top:4px; border-top-left-radius:11px; border-top-right-radius:11px; }
    .cell.ship.ship-v.ship-tail::before { bottom:4px; border-bottom-left-radius:5px; border-bottom-right-radius:5px; }
    .cell.ship.ship-single::before { inset:4px; border-radius:10px 10px 5px 5px; }
    .cell.ship:not(.hit):not(.miss)::after { content:""; position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:12px; height:4px; border-radius:3px; background:linear-gradient(90deg,#2d2f32,#6b7075); box-shadow:0 0 0 1px #0005 inset, 3px 0 0 -1px #23272b, -3px 0 0 -1px #23272b; z-index:2; }
    .cell.ship-1::before{ background:linear-gradient(180deg,#e8f0f8,#a8bdcf); }
    .cell.ship-2::before{ background:linear-gradient(180deg,#dce7f3,#9cb1c6); }
    .cell.ship-3::before{ background:linear-gradient(180deg,#d3dfec,#90a6bc); }
    .cell.ship-4::before{ background:linear-gradient(180deg,#c9d6e4,#879cb3); }
    .cell.ship-5::before{ background:linear-gradient(180deg,#bfcedc,#7e94ab); }
    .cell.ship-1:not(.hit):not(.miss)::after{ width:14px; }
    .cell.ship-2:not(.hit):not(.miss)::after{ width:12px; }
    .cell.ship-3:not(.hit):not(.miss)::after{ width:10px; }
    .cell.ship-4:not(.hit):not(.miss)::after{ width:10px; }
    .cell.ship-5:not(.hit):not(.miss)::after{ width:8px; }
    .cell.hit::before { content:""; position:absolute; width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff8787 0 18%, #f03131 22% 55%, #930f0f 78% 100%); left:50%; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 1px #ffd0d066, 0 2px 3px #0007; z-index:6; }
    .cell.miss::before { content:""; position:absolute; width:11px; height:11px; border-radius:50%; background:radial-gradient(circle, #0f3d31 0 35%, #081f18 36% 100%); left:50%; top:50%; transform:translate(-50%,-50%); box-shadow:inset 0 0 0 1px #0007, 0 0 0 1px #d8c9a355; z-index:6; }
    .cell:disabled { opacity:.86; cursor:not-allowed; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:12px; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px; }
  </style>
</head>
<body>
  <main class="app">
    <h2>BATTLESHIP</h2>
    <p class="subtitle">Vintage tabletop edition — realistic felt board and ship silhouettes.</p>

    <div class="row">
      <button id="create" class="primary">Create Room (2P)</button>
      <button id="createBot" class="primary">Play vs Computer</button>
      <input id="code" placeholder="Room code" />
      <button id="join">Join Room</button>
      <button id="auto" class="accent">Auto Place</button>
      <button id="ready">Ready</button>
      <button id="rematch">Rematch</button>
      <button id="soundToggle">Sound: On</button>
    </div>

    <div class="statusBar">
      <div id="meta">Create or join a room</div>
      <div id="status">Waiting</div>
    </div>

    <div class="boards">
      <section class="panel">
        <h4>Your Fleet</h4>
        <div class="boardShell">
          <div id="yourSide" class="sideLabels"></div>
          <div class="mainBoard"><div id="yourTop" class="topLabels"></div><div class="gridWrap"><div id="your" class="grid"></div><div id="yourShips" class="shipsOverlay"></div></div></div>
        </div>
        <div id="fleetInfo" class="fleetInfo"></div>
      </section>
      <section class="panel">
        <h4>Target Board</h4>
        <div class="boardShell">
          <div id="targetSide" class="sideLabels"></div>
          <div class="mainBoard"><div id="targetTop" class="topLabels"></div><div id="target" class="grid"></div></div>
        </div>
      </section>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:#b9cbe0"></i>Ships: Carrier, Battleship, Destroyer, Submarine, Patrol Boat</span>
      <span><i class="dot" style="background:#ff2f2f"></i>Hit</span>
      <span><i class="dot" style="background:radial-gradient(circle, #0f3d31 0 35%, #081f18 36% 100%); border:1px solid #d8c9a355"></i>Miss (empty peg hole)</span>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();
    let room = null, state = null, soundOn = true, lastEvent = '';
    const GRID_SIZE = 10;
    const letters = 'ABCDEFGHIJ'.split('');

    const your = document.getElementById('your');
    const yourShips = document.getElementById('yourShips');
    const target = document.getElementById('target');
    const status = document.getElementById('status');
    const meta = document.getElementById('meta');
    const fleetInfo = document.getElementById('fleetInfo');

    function setupLabels(topId, sideId) {
      const top = document.getElementById(topId);
      const side = document.getElementById(sideId);
      top.innerHTML = letters.map(l => `<div>${l}</div>`).join('');
      side.innerHTML = Array.from({ length: GRID_SIZE }, (_, i) => `<div>${i + 1}</div>`).join('');
    }
    setupLabels('yourTop', 'yourSide');
    setupLabels('targetTop', 'targetSide');

    const mk = (parent, fn) => {
      parent.innerHTML = '';
      for (let y = 0; y < GRID_SIZE; y++) for (let x = 0; x < GRID_SIZE; x++) {
        const b = document.createElement('button');
        b.className = 'cell';
        b.title = `${letters[x]}${y + 1}`;
        fn(b, x, y);
        parent.appendChild(b);
      }
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, dur = 0.12, type = 'sine', gain = 0.03) {
      if (!soundOn) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = gain;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }
    function playMiss() { beep(240, 0.08, 'triangle', 0.02); }
    function playHit() { beep(520, 0.12, 'square', 0.03); }
    function playSunk() { beep(320, 0.12, 'sawtooth', 0.03); setTimeout(() => beep(220, 0.12, 'sawtooth', 0.03), 130); }

    function shipSvg(id, dir) {
      const meta = {
        1: { turrets: 0, bridge: 2, deck: 'carrier' },
        2: { turrets: 3, bridge: 2, deck: 'warship' },
        3: { turrets: 2, bridge: 2, deck: 'warship' },
        4: { turrets: 0, bridge: 1, deck: 'sub' },
        5: { turrets: 1, bridge: 1, deck: 'patrol' }
      }[id] || { turrets: 1, bridge: 1, deck: 'warship' };

      const horizontal = dir === 'h';
      const W = horizontal ? 100 : 28;
      const H = horizontal ? 28 : 100;
      const midA = horizontal ? 14 : 14;

      const hull = horizontal
        ? "M2 14 Q10 3 28 3 H90 Q98 14 90 25 H28 Q10 25 2 14Z"
        : "M14 2 Q25 10 25 28 V90 Q14 98 3 90 V28 Q3 10 14 2Z";

      const rivets = horizontal
        ? Array.from({ length: 7 }, (_, i) => `<circle cx='${18 + i * 11}' cy='6' r='0.9' fill='#d9e1ea88'/><circle cx='${18 + i * 11}' cy='22' r='0.9' fill='#d9e1ea66'/>`).join('')
        : Array.from({ length: 7 }, (_, i) => `<circle cx='6' cy='${18 + i * 11}' r='0.9' fill='#d9e1ea88'/><circle cx='22' cy='${18 + i * 11}' r='0.9' fill='#d9e1ea66'/>`).join('');

      const turretNodes = Array.from({ length: meta.turrets }, (_, i) => {
        const t = meta.turrets === 1 ? 0.5 : i / (meta.turrets - 1);
        if (horizontal) {
          const x = 34 + t * 34;
          return `<g><circle cx='${x}' cy='14' r='2.8' fill='#2a3138' stroke='#c7d1da88' stroke-width='0.5'/><rect x='${x+1.6}' y='13.5' width='5' height='1' rx='0.5' fill='#20262d'/></g>`;
        }
        const y = 34 + t * 34;
        return `<g><circle cx='14' cy='${y}' r='2.8' fill='#2a3138' stroke='#c7d1da88' stroke-width='0.5'/><rect x='13.5' y='${y+1.6}' width='1' height='5' rx='0.5' fill='#20262d'/></g>`;
      }).join('');

      const bridges = Array.from({ length: meta.bridge }, (_, i) => {
        const t = meta.bridge === 1 ? 0.5 : i / (meta.bridge - 1);
        if (horizontal) {
          const x = 42 + t * 16;
          return `<rect x='${x-2}' y='11' width='4' height='6' rx='1' fill='#3a434d' stroke='#c7d1da66' stroke-width='0.4'/>`;
        }
        const y = 42 + t * 16;
        return `<rect x='11' y='${y-2}' width='6' height='4' rx='1' fill='#3a434d' stroke='#c7d1da66' stroke-width='0.4'/>`;
      }).join('');

      const deck = meta.deck === 'carrier'
        ? (horizontal
          ? "<rect x='18' y='10.2' width='68' height='7.6' rx='1.4' fill='none' stroke='#d7dee7b0' stroke-width='0.7'/><line x1='22' y1='14' x2='82' y2='14' stroke='#d7dee780' stroke-width='0.6'/>"
          : "<rect x='10.2' y='18' width='7.6' height='68' rx='1.4' fill='none' stroke='#d7dee7b0' stroke-width='0.7'/><line x1='14' y1='22' x2='14' y2='82' stroke='#d7dee780' stroke-width='0.6'/>")
        : meta.deck === 'sub'
          ? (horizontal
            ? "<ellipse cx='50' cy='14' rx='12' ry='2.4' fill='none' stroke='#d7dee780' stroke-width='0.7'/><circle cx='53' cy='10.5' r='1.1' fill='#d0d7df99'/>"
            : "<ellipse cx='14' cy='50' rx='2.4' ry='12' fill='none' stroke='#d7dee780' stroke-width='0.7'/><circle cx='10.5' cy='53' r='1.1' fill='#d0d7df99'/>")
          : (horizontal
            ? "<rect x='28' y='11' width='44' height='6' rx='2' fill='url(#deck)'/><line x1='28' y1='14' x2='72' y2='14' stroke='#1e242a66' stroke-width='0.8'/>"
            : "<rect x='11' y='28' width='6' height='44' rx='2' fill='url(#deck)'/><line x1='14' y1='28' x2='14' y2='72' stroke='#1e242a66' stroke-width='0.8'/>");

      return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}'>
        <defs>
          <linearGradient id='hull' x1='0' y1='0' x2='0' y2='1'>
            <stop offset='0' stop-color='#b9c2cb'/><stop offset='0.4' stop-color='#7a848f'/><stop offset='1' stop-color='#434c57'/>
          </linearGradient>
          <linearGradient id='deck' x1='0' y1='0' x2='0' y2='1'>
            <stop offset='0' stop-color='#2f3740'/><stop offset='1' stop-color='#5f6973'/>
          </linearGradient>
        </defs>
        <path d='${hull}' fill='url(#hull)' stroke='#d7dee6' stroke-opacity='0.65' stroke-width='0.8'/>
        ${deck}
        ${bridges}
        ${turretNodes}
        ${rivets}
      </svg>`;
    }

    function renderShipTokens() {
      if (!state?.you?.board) { yourShips.innerHTML = ''; return; }
      const board = state.you.board;
      const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
      yourShips.innerHTML = '';

      const cellAt = (x, y) => your.children[y * GRID_SIZE + x];
      const gridRect = your.getBoundingClientRect();

      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const id = board[y][x];
          if (id <= 0 || visited[y][x]) continue;

          let len = 1;
          let dir = 'h';
          if (x + 1 < GRID_SIZE && board[y][x + 1] === id) {
            dir = 'h';
            let xx = x;
            while (xx < GRID_SIZE && board[y][xx] === id) { visited[y][xx] = true; len++; xx++; }
            len -= 1;
          } else if (y + 1 < GRID_SIZE && board[y + 1][x] === id) {
            dir = 'v';
            let yy = y;
            while (yy < GRID_SIZE && board[yy][x] === id) { visited[yy][x] = true; len++; yy++; }
            len -= 1;
          } else {
            visited[y][x] = true;
          }

          const head = cellAt(x, y).getBoundingClientRect();
          const tail = dir === 'h' ? cellAt(x + len - 1, y).getBoundingClientRect() : cellAt(x, y + len - 1).getBoundingClientRect();

          const token = document.createElement('div');
          token.className = `shipToken ${dir} s${id}`;
          token.style.left = `${head.left - gridRect.left - 2}px`;
          token.style.top = `${head.top - gridRect.top - 2}px`;
          token.style.width = dir === 'h' ? `${tail.right - head.left + 4}px` : `${head.width + 4}px`;
          token.style.height = dir === 'v' ? `${tail.bottom - head.top + 4}px` : `${head.height + 4}px`;
          token.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(shipSvg(id, dir))}")`;

          const points = [];
          for (let i = 0; i < len; i++) points.push(dir === 'h' ? [x + i, y] : [x, y + i]);

          points.forEach(([px, py], i) => {
            const hole = document.createElement('div');
            hole.className = 'pegHole';
            if (state.you.incoming?.[py]?.[px] === 2) hole.classList.add('hit');
            const ratio = (i + 0.5) / len;
            if (dir === 'h') {
              hole.style.left = `${ratio * 100}%`;
              hole.style.top = '50%';
            } else {
              hole.style.left = '50%';
              hole.style.top = `${ratio * 100}%`;
            }
            token.appendChild(hole);
          });

          yourShips.appendChild(token);
        }
      }
    }

    const render = () => {
      if (!state) { mk(your, () => {}); mk(target, () => {}); yourShips.innerHTML = ''; fleetInfo.innerHTML = ''; return; }

      meta.textContent = `Room ${state.code} • Mode: ${state.mode === 'pvc' ? 'Single Player' : '2 Player'} • ${state.phase.toUpperCase()}`;
      const myTurn = state.turn && state.turn === s.id;

      if (state.winner) status.textContent = state.winner === s.id ? 'Victory — all enemy ships sunk!' : 'Defeat — your fleet has been sunk.';
      else if (state.phase === 'battle') status.textContent = myTurn ? 'Your turn: fire a shot.' : 'Opponent turn...';
      else status.textContent = state.status;

      if (state.lastEvent && state.lastEvent !== lastEvent) {
        if (/sank/i.test(state.lastEvent)) playSunk();
        else if (/hit/i.test(state.lastEvent)) playHit();
        else if (/miss/i.test(state.lastEvent)) playMiss();
        lastEvent = state.lastEvent;
      }

      mk(your, (b, x, y) => {
        const v = state.you.board[y][x];
        const inc = state.you.incoming?.[y]?.[x] || 0;
        if (v > 0) b.classList.add(`ship-${v}`);
        if (inc === 1) b.classList.add('miss');
        if (inc === 2) b.classList.add('hit');
        b.disabled = true;
      });

      mk(target, (b, x, y) => {
        const v = state.you.shots[y][x];
        if (v === 1) b.classList.add('miss');
        if (v === 2) b.classList.add('hit');
        b.disabled = !(state.phase === 'battle' && state.turn === s.id && v === 0 && !state.winner && !state.processingTurn);
        b.onclick = () => s.emit('fire', { code: room, x, y });
      });

      renderShipTokens();

      const ships = Object.values(state.you.shipStatus || {});
      fleetInfo.innerHTML = ships.map(sv => {
        const left = Math.max(0, sv.len - sv.hits);
        const pct = Math.max(0, Math.min(100, (left / sv.len) * 100));
        return `<div class="fleetRow"><span>${sv.name}</span><span style="opacity:.85">${left}/${sv.len}</span></div><div class="fleetBar" style="width:${pct}%"></div>`;
      }).join('');
    };

    document.getElementById('create').onclick = () => s.emit('createRoom', { mode: 'pvp' });
    document.getElementById('createBot').onclick = () => s.emit('createRoom', { mode: 'pvc' });
    document.getElementById('join').onclick = () => s.emit('joinRoom', document.getElementById('code').value);
    document.getElementById('auto').onclick = () => room && s.emit('autoPlace', room);
    document.getElementById('ready').onclick = () => room && s.emit('ready', room);
    document.getElementById('rematch').onclick = () => room && s.emit('rematch', room);
    document.getElementById('soundToggle').onclick = (e) => {
      soundOn = !soundOn;
      e.target.textContent = `Sound: ${soundOn ? 'On' : 'Off'}`;
    };

    s.on('roomCreated', d => { room = d.code; document.getElementById('code').value = room; });
    s.on('roomJoined', d => { room = d.code; document.getElementById('code').value = room; });
    s.on('state', d => { state = d; room = d.code; render(); });
    s.on('errorMsg', m => status.textContent = m);

    render();
  </script>
</body>
</html>
