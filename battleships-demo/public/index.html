<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Battleships Demo</title>
  <style>
    :root { --felt:#0f5b45; --felt2:#0a3f31; --wood:#5f3f28; --line:#f3f6ff66; --text:#f4fbff; --muted:#d6e1ea; --hit:#ff2d2d; --miss:#f5f8ff; --cell: clamp(24px, 7.2vw, 34px); --gap: clamp(2px, 0.8vw, 4px); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,Arial,sans-serif; color:var(--text); min-height:100vh; padding:16px; background:linear-gradient(#00000066,#00000080), url('/assets/reference-bg.jpg') center/cover fixed no-repeat; }
    .app { max-width:980px; margin:0 auto; background:linear-gradient(180deg,#0d4e3dF2,#0a3a2eF2); border:1px solid #d7b88a66; border-radius:14px; padding:16px; box-shadow:0 24px 50px #000a, inset 0 0 0 1px #ffffff12; backdrop-filter: blur(2px); }
    h2 { margin:4px 0; letter-spacing:0.4px; } .subtitle { margin:0 0 12px; color:var(--muted); font-size:13px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    button,input { padding:10px 12px; border-radius:10px; border:1px solid #ead5ad66; background:#173b31E6; color:var(--text); font-weight:600; }
    input { min-width:130px; } button:hover { filter:brightness(1.08); }
    .primary { background:linear-gradient(135deg,#1b6f57,#289376); }
    .accent { background:linear-gradient(135deg,#7b4f09,#c08a1a); border-color:#f0c97b99; color:#fff5d8; }
    .statusBar { background:#08271fD9; border:1px solid #e7d3af55; border-radius:10px; padding:10px; margin-bottom:12px; }
    #meta { color:var(--muted); font-size:13px; } #status { font-size:14px; margin-top:4px; font-weight:700; color:#ffe5a6; }
    .boards { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media(max-width:900px){ .boards{grid-template-columns:1fr;} .app{padding:12px;} body{padding:10px;} .row button,.row input{flex:1 1 calc(50% - 8px);} }
    .panel { background:linear-gradient(180deg,#0f4e3d,#0d3e31); border:2px solid #6a4830; border-radius:12px; padding:10px; box-shadow: inset 0 0 0 1px #ffffff12, 0 8px 14px #0006; }
    .panel h4 { margin:0 0 8px; font-size:15px; }
    .boardShell { display:grid; grid-template-columns:18px auto; gap:6px; align-items:start; }
    .sideLabels { display:grid; grid-template-rows:repeat(10,var(--cell)); gap:var(--gap); font-size:12px; color:#dce8f2; align-items:center; text-align:center; }
    .mainBoard { display:block; }
    .topLabels { display:grid; grid-template-columns:repeat(10,var(--cell)); gap:var(--gap); margin-bottom:4px; font-size:12px; color:#dce8f2; text-align:center; }
    .grid { display:grid; grid-template-columns:repeat(10,var(--cell)); grid-auto-rows:var(--cell); gap:var(--gap); min-width:max-content; }
    .cell { width:var(--cell); height:var(--cell); border:1px solid var(--line); border-radius:2px; background:linear-gradient(180deg,#17664f,#14513f); cursor:pointer; position:relative; overflow:visible; }
    .cell.ship::before { content:""; position:absolute; background:linear-gradient(180deg,#d4dde8,#8498ac); box-shadow:inset 0 0 0 1px #ffffff77, 0 1px 2px #0008; z-index:1; }
    .cell.ship.ship-h::before { top:5px; bottom:5px; left:-3px; right:-3px; border-radius:0; }
    .cell.ship.ship-v::before { left:5px; right:5px; top:-3px; bottom:-3px; border-radius:0; }
    .cell.ship.ship-h.ship-head::before { left:4px; border-top-left-radius:10px; border-bottom-left-radius:10px; }
    .cell.ship.ship-h.ship-tail::before { right:4px; border-top-right-radius:5px; border-bottom-right-radius:5px; }
    .cell.ship.ship-v.ship-head::before { top:4px; border-top-left-radius:10px; border-top-right-radius:10px; }
    .cell.ship.ship-v.ship-tail::before { bottom:4px; border-bottom-left-radius:5px; border-bottom-right-radius:5px; }
    .cell.ship.ship-single::before { inset:4px; border-radius:10px 10px 5px 5px; }
    .cell.ship:not(.hit):not(.miss)::after { content:""; position:absolute; width:6px; height:6px; border-radius:2px; left:50%; top:52%; transform:translate(-50%,-50%); background:#3f5063; box-shadow:0 0 0 1px #ffffff50; z-index:2; }
    .cell.ship-1::before{ background:linear-gradient(180deg,#e5edf7,#a4b8cc); }
    .cell.ship-2::before{ background:linear-gradient(180deg,#d9e4f1,#97acc1); }
    .cell.ship-3::before{ background:linear-gradient(180deg,#cfdbe8,#8ea4ba); }
    .cell.ship-4::before{ background:linear-gradient(180deg,#c5d2e0,#849ab1); }
    .cell.ship-5::before{ background:linear-gradient(180deg,#bdcad8,#7b92aa); }
    .cell.hit::before { content:""; position:absolute; width:13px; height:13px; border-radius:50%; background:var(--hit); left:50%; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px #ffc0c077; }
    .cell.miss::before { content:""; position:absolute; width:11px; height:11px; border-radius:50%; background:var(--miss); left:50%; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 1px #0004; }
    .cell:disabled { opacity:.86; cursor:not-allowed; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:12px; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px; }
  </style>
</head>
<body>
  <main class="app">
    <h2>Battleships Demo</h2>
    <p class="subtitle">High-contrast felt-table style inspired by classic naval board gameplay.</p>

    <div class="row">
      <button id="create" class="primary">Create Room (2P)</button>
      <button id="createBot" class="primary">Play vs Computer</button>
      <input id="code" placeholder="Room code" />
      <button id="join">Join Room</button>
      <button id="auto" class="accent">Auto Place</button>
      <button id="ready">Ready</button>
      <button id="rematch">Rematch</button>
      <button id="soundToggle">Sound: On</button>
    </div>

    <div class="statusBar">
      <div id="meta">Create or join a room</div>
      <div id="status">Waiting</div>
    </div>

    <div class="boards">
      <section class="panel">
        <h4>Your Fleet</h4>
        <div class="boardShell">
          <div id="yourSide" class="sideLabels"></div>
          <div class="mainBoard"><div id="yourTop" class="topLabels"></div><div id="your" class="grid"></div></div>
        </div>
      </section>
      <section class="panel">
        <h4>Target Board</h4>
        <div class="boardShell">
          <div id="targetSide" class="sideLabels"></div>
          <div class="mainBoard"><div id="targetTop" class="topLabels"></div><div id="target" class="grid"></div></div>
        </div>
      </section>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:#b9cbe0"></i>Ships: Carrier, Battleship, Destroyer, Submarine, Patrol Boat</span>
      <span><i class="dot" style="background:#ff2f2f"></i>Hit</span>
      <span><i class="dot" style="background:#f5f8ff"></i>Miss</span>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();
    let room = null, state = null, soundOn = true, lastEvent = '';
    const GRID_SIZE = 10;
    const letters = 'ABCDEFGHIJ'.split('');

    const your = document.getElementById('your');
    const target = document.getElementById('target');
    const status = document.getElementById('status');
    const meta = document.getElementById('meta');

    function setupLabels(topId, sideId) {
      const top = document.getElementById(topId);
      const side = document.getElementById(sideId);
      top.innerHTML = letters.map(l => `<div>${l}</div>`).join('');
      side.innerHTML = Array.from({ length: GRID_SIZE }, (_, i) => `<div>${i + 1}</div>`).join('');
    }
    setupLabels('yourTop', 'yourSide');
    setupLabels('targetTop', 'targetSide');

    const mk = (parent, fn) => {
      parent.innerHTML = '';
      for (let y = 0; y < GRID_SIZE; y++) for (let x = 0; x < GRID_SIZE; x++) {
        const b = document.createElement('button');
        b.className = 'cell';
        b.title = `${letters[x]}${y + 1}`;
        fn(b, x, y);
        parent.appendChild(b);
      }
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, dur = 0.12, type = 'sine', gain = 0.03) {
      if (!soundOn) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = gain;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }
    function playMiss() { beep(240, 0.08, 'triangle', 0.02); }
    function playHit() { beep(520, 0.12, 'square', 0.03); }
    function playSunk() { beep(320, 0.12, 'sawtooth', 0.03); setTimeout(() => beep(220, 0.12, 'sawtooth', 0.03), 130); }

    const render = () => {
      if (!state) { mk(your, () => {}); mk(target, () => {}); return; }

      meta.textContent = `Room ${state.code} • Mode: ${state.mode === 'pvc' ? 'Single Player' : '2 Player'} • ${state.phase.toUpperCase()}`;
      const myTurn = state.turn && state.turn === s.id;

      if (state.winner) status.textContent = state.winner === s.id ? 'Victory — all enemy ships sunk!' : 'Defeat — your fleet has been sunk.';
      else if (state.phase === 'battle') status.textContent = myTurn ? 'Your turn: fire a shot.' : 'Opponent turn...';
      else status.textContent = state.status;

      if (state.lastEvent && state.lastEvent !== lastEvent) {
        if (/sank/i.test(state.lastEvent)) playSunk();
        else if (/hit/i.test(state.lastEvent)) playHit();
        else if (/miss/i.test(state.lastEvent)) playMiss();
        lastEvent = state.lastEvent;
      }

      mk(your, (b, x, y) => {
        const v = state.you.board[y][x];
        const inc = state.you.incoming?.[y]?.[x] || 0;
        if (v > 0) {
          const same = (nx, ny) => ny >= 0 && ny < GRID_SIZE && nx >= 0 && nx < GRID_SIZE && state.you.board[ny][nx] === v;
          const L = same(x - 1, y), R = same(x + 1, y), U = same(x, y - 1), D = same(x, y + 1);
          const horizontal = L || R;
          const vertical = U || D;

          b.classList.add('ship');
          b.classList.add(`ship-${v}`);

          if (horizontal) {
            b.classList.add('ship-h');
            if (!L) b.classList.add('ship-head');
            if (!R) b.classList.add('ship-tail');
          } else if (vertical) {
            b.classList.add('ship-v');
            if (!U) b.classList.add('ship-head');
            if (!D) b.classList.add('ship-tail');
          } else {
            b.classList.add('ship-single');
          }
        }
        if (inc === 1) b.classList.add('miss');
        if (inc === 2) b.classList.add('hit');
        b.disabled = true;
      });

      mk(target, (b, x, y) => {
        const v = state.you.shots[y][x];
        if (v === 1) b.classList.add('miss');
        if (v === 2) b.classList.add('hit');
        b.disabled = !(state.phase === 'battle' && state.turn === s.id && v === 0 && !state.winner && !state.processingTurn);
        b.onclick = () => s.emit('fire', { code: room, x, y });
      });
    };

    document.getElementById('create').onclick = () => s.emit('createRoom', { mode: 'pvp' });
    document.getElementById('createBot').onclick = () => s.emit('createRoom', { mode: 'pvc' });
    document.getElementById('join').onclick = () => s.emit('joinRoom', document.getElementById('code').value);
    document.getElementById('auto').onclick = () => room && s.emit('autoPlace', room);
    document.getElementById('ready').onclick = () => room && s.emit('ready', room);
    document.getElementById('rematch').onclick = () => room && s.emit('rematch', room);
    document.getElementById('soundToggle').onclick = (e) => {
      soundOn = !soundOn;
      e.target.textContent = `Sound: ${soundOn ? 'On' : 'Off'}`;
    };

    s.on('roomCreated', d => { room = d.code; document.getElementById('code').value = room; });
    s.on('roomJoined', d => { room = d.code; document.getElementById('code').value = room; });
    s.on('state', d => { state = d; room = d.code; render(); });
    s.on('errorMsg', m => status.textContent = m);

    render();
  </script>
</body>
</html>
