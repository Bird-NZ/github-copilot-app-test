<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Battleships Demo</title><style>body{font-family:Arial;margin:16px;background:#0f172a;color:#e2e8f0}button,input{padding:8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0} .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.boards{grid-template-columns:1fr}}.grid{display:grid;grid-template-columns:repeat(8,34px);gap:3px}.cell{width:34px;height:34px;border:1px solid #334155;border-radius:4px;background:#111827}.ship{background:#64748b}.hit{background:#ef4444}.miss{background:#0ea5e9}.muted{color:#94a3b8}</style></head><body><h2>Battleships Demo</h2><div class='row'><button id='create'>Create Room</button><input id='code' placeholder='Room code'/><button id='join'>Join Room</button><button id='auto'>Auto Place</button><button id='ready'>Ready</button><button id='rematch'>Rematch</button></div><div id='meta' class='muted'>Create or join a room</div><div id='status'></div><div class='boards'><div><h4>Your Fleet</h4><div id='your' class='grid'></div></div><div><h4>Target Board</h4><div id='target' class='grid'></div></div></div><script src='/socket.io/socket.io.js'></script><script>const s=io();let room=null,state=null;const your=document.getElementById('your'),target=document.getElementById('target'),status=document.getElementById('status'),meta=document.getElementById('meta');const mk=(p,fn)=>{p.innerHTML='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const b=document.createElement('button');b.className='cell';fn(b,x,y);p.appendChild(b)}};const render=()=>{if(!state){mk(your,()=>{});mk(target,()=>{});return;}meta.textContent=`Room ${state.code} | ${state.phase} | ${state.bothPresent?'2 players':'waiting'}`;const myTurn=state.turn&&state.you&&state.turn===s.id;status.textContent=state.winner?(state.winner===s.id?'You win!':'You lose!'):(state.phase==='battle'?(myTurn?'Your turn':'Opponent turn'):state.status);mk(your,(b,x,y)=>{const v=state.you.board[y][x];if(v===1)b.classList.add('ship');if(v===2)b.classList.add('hit');});mk(target,(b,x,y)=>{const v=state.you.shots[y][x];if(v===1)b.classList.add('miss');if(v===2)b.classList.add('hit');b.disabled=!(state.phase==='battle'&&state.turn===s.id&&v===0&&!state.winner);b.onclick=()=>s.emit('fire',{code:room,x,y});});};document.getElementById('create').onclick=()=>s.emit('createRoom');document.getElementById('join').onclick=()=>s.emit('joinRoom',document.getElementById('code').value);document.getElementById('auto').onclick=()=>room&&s.emit('autoPlace',room);document.getElementById('ready').onclick=()=>room&&s.emit('ready',room);document.getElementById('rematch').onclick=()=>room&&s.emit('rematch',room);s.on('roomCreated',d=>{room=d.code;document.getElementById('code').value=room;});s.on('roomJoined',d=>{room=d.code;document.getElementById('code').value=room;});s.on('state',d=>{state=d;room=d.code;render();});s.on('errorMsg',m=>status.textContent=m);render();</script></body></html>
