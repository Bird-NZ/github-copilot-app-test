project:
  summary: A minimal Azure Function with HTTP trigger that returns "Hello World" and writes a JSON payload to blob storage.
    This prototype serves as both a learning exercise and a reusable template demonstrating serverless compute, managed identity
    authentication, and secure storage access following Microsoft Cloud Adoption Framework conventions.
  goals:
  - Create a working hello-world Azure Function for learning Azure serverless patterns
  - Demonstrate managed identity authentication without connection strings or access keys
  - Build a reusable template that can be extended for future serverless projects
  - Follow Microsoft CAF naming conventions and standard tagging practices
  - Include Application Insights for observability and telemetry
  - Deploy to Azure Australia East region with minimal cost (<$5/month)
requirements:
  functional:
  - HTTP GET endpoint that returns "Hello World" response
  - On each invocation, write a JSON payload to Azure Blob Storage containing timestamp, request ID, message, and HTTP method
  - 'Each invocation creates a new blob with unique name pattern: `hello-{timestamp}-{guid}.json`'
  - Storage container named `function-output` pre-created by infrastructure
  - Python 3.12 runtime using Azure Functions v2 programming model
  - Function authenticates to storage using system-assigned managed identity with Storage Blob Data Contributor role
  - Storage account has public blob access disabled (no anonymous access)
  - Function accessible via public HTTP endpoint (no API Management for this prototype)
  non_functional:
  - Use Microsoft Cloud Adoption Framework naming conventions for all resources
  - 'Apply standard tags to all resources: Environment=dev, Owner=mat, Purpose=prototype, ManagedBy=terraform, Project=helloworld'
  - Storage account uses LRS replication (dev/test tier)
  - Function uses Consumption plan for cost efficiency
  - Application Insights with 90-day log retention for observability
  - All resources deployed to Australia East region
  - Infrastructure defined in Terraform
  - 'Total monthly cost target: under $5 AUD'
constraints:
- Must use managed identity only — no connection strings, access keys, or SQL authentication
- Storage account must have shared key access disabled and public blob access disabled
- Must follow CAF naming conventions exactly
- All resources must be in a single resource group
- Python 3.12 runtime requirement
- Deploy to Australia East region only (single region)
- 'Timeline: deliver ASAP'
- 'Policy override: None - User chose to override'
decisions:
- Use Consumption plan (not Premium) for simplicity and cost optimization
- Use "Allow trusted Microsoft services" exception for storage firewall to avoid VNET complexity
- Use synchronous Python code (not async/await) for easier learning and readability
- Use modular Terraform structure (main.tf, variables.tf, outputs.tf, storage.tf, function.tf) for reusability
- Scope system-assigned managed identity role assignment to entire storage account (not individual container)
- Include Application Insights with auto-instrumentation plus example custom logging
- 'JSON payload format: `{"timestamp": "ISO8601", "requestId": "guid", "message": "Hello World", "method": "GET"}`'
- 'Blob naming pattern: `hello-{timestamp}-{guid}.json` for unique blobs per invocation'
- Pre-create storage container in Terraform to avoid runtime permission issues
- Function code deployment via Azure Functions Core Tools (not Terraform archive upload) for iterative development
- Local state for Terraform (not remote backend) to keep setup simple
open_items:
- Deploy script to automate everything?
- VS Code configuration for local dev?
- Should the template include a deploy.sh script to automate terraform init/apply and function deployment, or rely on manual
  README instructions?
- Should VS Code configuration (.vscode folder with launch.json, settings.json) be included for local development setup?
- Should the template demonstrate both local testing with Azurite and Azure deployment, or focus only on Azure deployment?
- Should a sample Kusto query be included in the README to demonstrate querying Application Insights logs?
- Should the template include commented examples of how to extend to Premium plan + VNET + private endpoints for production?
confirmed_items:
- Terraform code (infrastructure)
- Python function code (HTTP trigger + blob write)
- README with deployment instructions
- Example test requests
risks:
- Consumption plan has cold start latency (5-10 seconds on first invocation) which may surprise users expecting instant response
  — document this as expected behavior
- Storage firewall "trusted Microsoft services" exception is simpler but less restrictive than private endpoints — acceptable
  for learning prototype but should be flagged as production upgrade path
- Local development with Azurite works seamlessly, but testing against real Azure storage from laptop requires temporarily
  adding developer IP to storage firewall — needs clear documentation
- Function code deployment is separate from Terraform (requires func CLI) which may confuse users expecting single command
  deployment — README must clearly separate infrastructure provisioning from code deployment steps
- Storage costs could grow unbounded if function is invoked frequently — consider adding lifecycle policy to auto-delete blobs
  older than 7 days
scope:
  in_scope:
  - Azure Function App with HTTP trigger endpoint returning "Hello World"
  - System-assigned managed identity configuration
  - Azure Storage Account with blob container for output
  - RBAC role assignment (Storage Blob Data Contributor) for function identity
  - Terraform infrastructure code (modular structure)
  - Python 3.12 function code with blob write logic
  - Application Insights integration with auto-instrumentation
  - README with deployment and testing instructions
  - Example test requests (curl commands)
  - CAF naming conventions and standard tagging on all resources
  - 'Storage account security: shared key disabled, public blob access disabled, trusted services exception enabled'
  out_of_scope:
  - API Management gateway (explicitly excluded for this minimal prototype)
  - Private endpoints and VNET integration (too complex for hello-world learning example)
  - Premium Function App plan features (always-warm instances, VNET support)
  - Multi-region deployment or geo-redundancy
  - Automated CI/CD pipelines
  - Comprehensive monitoring dashboards or alerting rules
  - Load testing or performance optimization
  - Backup and disaster recovery procedures
  - Key Vault (no secrets needed with managed identity)
  - Custom domain or TLS certificate configuration
  deferred:
  - Azure Dashboard or Workbook for telemetry visualization
  - Lifecycle policy on storage container to auto-delete old blobs after 7 days
  - Custom metrics and structured logging examples beyond basic Application Insights auto-instrumentation
  - Deploy script to automate full infrastructure + code deployment
  - VS Code workspace configuration for local development
  - Postman collection or REST Client file for comprehensive API testing
  - Terraform remote state backend configuration for team collaboration
  - Extension to Premium plan with private endpoint pattern as production upgrade path
  - Secondary region deployment (Australia Southeast) for multi-region patterns
  - Container creation logic in function code (currently pre-created by Terraform)
architecture:
  services:
  - 'Azure Functions (Consumption Plan)**: Serverless compute for HTTP-triggered function, Python 3.12 runtime, system-assigned
    managed identity, scales to zero when idle'
  - 'Azure Storage Account (Standard LRS)**: Blob storage for JSON payloads, shared key disabled, public blob access disabled,
    trusted services exception enabled, CAF naming: sthelloworlddevaue'
  - 'Application Insights**: Telemetry and logging via auto-instrumentation, 90-day retention, connected via APPLICATIONINSIGHTS_CONNECTION_STRING'
  - 'Log Analytics Workspace**: Backing store for Application Insights logs, 90-day retention, CAF naming: log-helloworld-dev-aue'
  - 'App Service Plan (Consumption)**: Hosting plan for Azure Functions, Y1 SKU (dynamic), Australia East region'
  - 'Resource Group**: Single resource group containing all resources, CAF naming: rg-helloworld-dev-aue'
  integrations: []
  data_flow: ''
